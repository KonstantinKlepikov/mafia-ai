services:
  mafia-ai-service:
    build:
      context: ..
      dockerfile: infra/mafia_service/Dockerfile
    container_name: mafia-ai-service
    env_file:
      - .env
    ports:
      - "38550:8550"
    environment:
      # Ollama settings
      - OLLAMA_MODEL=${OLLAMA_MODEL?Variable not set}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - LLM_POOL_SIZE=${LLM_POOL_SIZE:-0}
      # Game settings
      - AGENT_COUNT=${AGENT_COUNT:-10}
      - MAFIA_COUNT=${MAFIA_COUNT:-3}
      - PHASE_DURATION_SECONDS=${PHASE_DURATION_SECONDS:-180}
      - VOTE_TIMEOUT_SECONDS=${VOTE_TIMEOUT_SECONDS:-60}
      - MESSAGE_MAX_TOKENS=${MESSAGE_MAX_TOKENS:-150}
      - VOTE_MAX_TOKENS=${VOTE_MAX_TOKENS:-50}
      # UI settings
      - UI_ENABLED=${UI_ENABLED:-true}
      - UI_PORT=${UI_PORT:-8550}
    volumes:
      - ${PWD}/config:/app/config:ro
      - ollama_models:/root/.ollama
      - ../src:/app/src
      - ../tests:/app/tests
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8550"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  ollama_models:

