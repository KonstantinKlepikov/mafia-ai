services:
  mafia-ai-service:
    build:
      context: ..
      dockerfile: infra/mafia_service/Dockerfile
    container_name: mafia-ai-service
    env_file:
      - .env
    ports:
      - "38550:8550"
    environment:
      # Ollama settings
      - OLLAMA_BINARY_PATH=ollama
      - OLLAMA_MODEL=${OLLAMA_MODEL?Variable not set}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - LLM_POOL_SIZE=${LLM_POOL_SIZE:-0}
      # Game settings
      - AGENT_COUNT=${AGENT_COUNT?Variable not set}
      - MAFIA_COUNT=${MAFIA_COUNT?Variable not set}
      - PHASE_DURATION_SECONDS=${PHASE_DURATION_SECONDS?Variable not set}
      - VOTE_TIMEOUT_SECONDS=${VOTE_TIMEOUT_SECONDS?Variable not set}
      - MESSAGE_MAX_TOKENS=${MESSAGE_MAX_TOKENS?Variable not set}
      - VOTE_MAX_TOKENS=${VOTE_MAX_TOKENS?Variable not set}
      # UI settings
      - UI_ENABLED=${UI_ENABLED:-true}
      - UI_PORT=8550
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-2.0}
    volumes:
      - ${PWD}/config:/app/config:ro
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8550"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  ollama_models:

