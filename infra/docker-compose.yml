services:
  mafia-ai-rabbitmq:
    image: rabbitmq:4.3-management-alpine
    env_file:
      - .env
    ports:
      - "35672:5672"
      - "35673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER?Variable not set}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS?Variable not set}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-mafia.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    networks:
      - game_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mafia-ai-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${PWD}/infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - game_net

  mafia-ai-zipkin:
    image: openzipkin/zipkin
    ports:
      - "29411:9411"
    depends_on: [mafia-ai-otel-collector]
    networks:
      - game_net

  mafia-ai-ollama:
    env_file:
      - .env
    build:
      context: ./ollama
      dockerfile: Dockerfile
    ports:
      - "31434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL?Variable not set}
    networks:
      - game_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mafia-ai-llm:
    env_file:
      - .env
    build:
      context: ..
      dockerfile: infra/llm/Dockerfile
    ports:
      - "38080:8080"
    environment:
      - OLLAMA_URL=${OLLAMA_URL?Variable not set}
      - OLLAMA_MODEL=${OLLAMA_MODEL?Variable not set}
      - LLM_QUEUE_MAX_SIZE=${LLM_QUEUE_MAX_SIZE?Variable not set}
      - LLM_POOL_SIZE=${LLM_POOL_SIZE:-0}
      - SERVICENAME=${SERVICENAME?Variable not set}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED?Variable not set}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT?Variable not set}
    depends_on:
      mafia-ai-ollama:
        condition: service_healthy
    networks:
      - game_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mafia-ai-game-service:
    build:
      context: ..
      dockerfile: infra/game_service/Dockerfile
    container_name: mafia-ai-game-service
    env_file:
      - .env
    ports:
      - "38081:8081"
    environment:
      - AMQP_URL=${AMQP_URL?Variable not set}
      - LLM_URL=${LLM_URL?Variable not set}
      - AGENT_COUNT=${AGENT_COUNT?Variable not set}
      - MAFIA_COUNT=${MAFIA_COUNT?Variable not set}
      - PHASE_DURATION_SECONDS=${PHASE_DURATION_SECONDS?Variable not set}
      - VOTE_TIMEOUT_SECONDS=${VOTE_TIMEOUT_SECONDS?Variable not set}
      - MESSAGE_MAX_TOKENS=${MESSAGE_MAX_TOKENS?Variable not set}
      - VOTE_MAX_TOKENS=${VOTE_MAX_TOKENS?Variable not set}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT?Variable not set}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED?Variable not set}
    volumes:
      - ${PWD}/config:/app/config:ro
    networks:
      - game_net
    depends_on:
      mafia-ai-rabbitmq:
        condition: service_healthy
      mafia-ai-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/game/state"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mafia-ai-admin-flet:
    build:
      context: ..
      dockerfile: infra/admin_flet/Dockerfile
    container_name: mafia-ai-admin-flet
    env_file:
      - .env
    ports:
      - "38550:8550"
    environment:
      - GAME_SERVICE_URL=${GAME_SERVICE_URL?Variable not set}
      - AMQP_URL=${AMQP_URL?Variable not set}
    networks:
      - game_net
    depends_on:
      mafia-ai-game-service:
        condition: service_healthy
      mafia-ai-rabbitmq:
        condition: service_healthy

  mafia-ai-prometheus:
    image: prom/prometheus:v3.2.0
    volumes:
      - ${PWD}/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "39090:9090"
    networks:
      - game_net

  mafia-ai-grafana:
    image: grafana/grafana:latest
    volumes:
      - ${PWD}/infra/grafana/provisioning:/etc/grafana/provisioning
      - ${PWD}/infra/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "33000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    networks:
      - game_net

  mafia-ai-loki:
    image: grafana/loki:latest
    volumes:
      - ${PWD}/infra/loki/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "33100:3100"
    networks:
      - game_net

  mafia-ai-promtail:
    image: grafana/promtail:latest
    volumes:
      - ${PWD}/infra/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/log:/var/log
    networks:
      - game_net

networks:
  game_net:
    driver: bridge

volumes:
  ollama_data:
