server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://mafia-ai-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only mafia-ai game/service containers (exclude observability stack)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/mafia-ai-(llm|orchestrator|agent|admin|vectordb|rabbitmq|ollama).*"
        action: keep
      # Strip leading slash from container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        replacement: "$1"
        target_label: "container"
    pipeline_stages:
      # Parse loguru JSON (no-op for non-JSON lines)
      - json:
          expressions:
            level: "record.level.name"
            service: "record.extra.service"
            trace_id: "record.extra.trace_id"
      # Promote extracted fields to Loki stream labels
      - labels:
          level:
          service:
