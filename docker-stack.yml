name: infra
services:
  mafia-ai-agent-1:
    build:
      context: /home/kklepikov/_code_/mafia-ai
      dockerfile: infra/agent/Dockerfile
    depends_on:
      mafia-ai-llm:
        condition: service_healthy
      mafia-ai-rabbitmq:
        condition: service_healthy
      mafia-ai-vectordb-seed:
        condition: service_completed_successfully
    environment:
      AGENT_COUNT: "10"
      AGENT_HTTP_PORT: "8100"
      AGENT_ID: agent-1
      AMQP_URL: amqp://guest:guest@mafia-ai-rabbitmq:5672/
      LLM_QUEUE_MAX_SIZE: "10"
      LLM_URL: http://mafia-ai-llm:8080
      MAFIA_COUNT: "2"
      OLLAMA_MODEL: ministral-3
      OLLAMA_URL: http://mafia-ai-ollama:11434
      PERSONA_ID: persona_1_good_natured
      PHASE_DURATION_SECONDS: "60"
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_USER: guest
      SERVICENAME: llm
      VECTOR_DB_URL: http://vectordb:6333
      VECTORDB_HOST: mafia-ai-vectordb
      VECTORDB_PORT: "8000"
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8100/agent/info
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 15s
    networks:
      game_net: null
    ports:
    - mode: ingress
      target: 8100
      published: "38101"
      protocol: tcp
