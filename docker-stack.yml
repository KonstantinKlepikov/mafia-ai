    ports:
    - mode: ingress
      target: 8080
      published: "38080"
      protocol: tcp
  mafia-ai-ollama:
    build:
      context: /home/kklepikov/_code_/mafia-ai/infra/ollama
      dockerfile: Dockerfile
    environment:
      AGENT_COUNT: "10"
      AGENT_HTTP_PORT: "8100"
      AMQP_URL: amqp://guest:guest@mafia-ai-rabbitmq:5672/
      LLM_QUEUE_MAX_SIZE: "10"
      LLM_URL: http://mafia-ai-llm:8080
      MAFIA_COUNT: "2"
      OLLAMA_MODEL: ministral-3
      OLLAMA_URL: http://mafia-ai-ollama:11434
      PHASE_DURATION_SECONDS: "60"
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_USER: guest
      SERVICENAME: llm
      VECTOR_DB_URL: http://vectordb:6333
      VECTORDB_HOST: mafia-ai-vectordb
      VECTORDB_PORT: "8000"
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:11434/api/tags
      timeout: 10s
      interval: 15s
      retries: 10
      start_period: 30s
    networks:
      game_net: null
    ports:
    - mode: ingress
      target: 11434
      published: "31434"
      protocol: tcp
    volumes:
    - type: volume
      source: ollama_data
      target: /root/.ollama
      volume: {}
  mafia-ai-otel-collector:
    command:
    - --config=/etc/otel-collector-config.yaml
    image: otel/opentelemetry-collector-contrib:0.111.0
    networks:
      game_net: null
    volumes:
    - type: bind
      source: /home/kklepikov/_code_/mafia-ai/infra/vectordb/otel-collector-config.yaml
      target: /etc/otel-collector-config.yaml
      bind:
        create_host_path: true
  mafia-ai-rabbitmq:
    environment:
      AGENT_COUNT: "10"
      AGENT_HTTP_PORT: "8100"
      AMQP_URL: amqp://guest:guest@mafia-ai-rabbitmq:5672/
      LLM_QUEUE_MAX_SIZE: "10"
      LLM_URL: http://mafia-ai-llm:8080
      MAFIA_COUNT: "2"
      OLLAMA_MODEL: ministral-3
      OLLAMA_URL: http://mafia-ai-ollama:11434
      PHASE_DURATION_SECONDS: "60"
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_USER: guest
      SERVICENAME: llm
      VECTOR_DB_URL: http://vectordb:6333
      VECTORDB_HOST: mafia-ai-vectordb
      VECTORDB_PORT: "8000"
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - ping
      timeout: 5s
      interval: 10s
      retries: 5
    image: rabbitmq:4.3-management-alpine
    networks:
      game_net: null
    ports:
    - mode: ingress
      target: 5672
      published: "35672"
      protocol: tcp
    - mode: ingress
      target: 15672
      published: "35673"
      protocol: tcp
    volumes:
    - type: bind
      source: /home/kklepikov/_code_/mafia-ai/infra/rabbitmq/rabbitmq.conf
      target: /etc/rabbitmq/conf.d/10-mafia.conf
      bind:
        create_host_path: true
    - type: bind
      source: /home/kklepikov/_code_/mafia-ai/infra/rabbitmq/definitions.json
      target: /etc/rabbitmq/definitions.json
      bind:
        create_host_path: true
  mafia-ai-vectordb:
    depends_on:
      mafia-ai-otel-collector:
        condition: service_started
      mafia-ai-zipkin:
        condition: service_started
    environment:
      CHROMA_OPEN_TELEMETRY__ENDPOINT: http://mafia-ai-otel-collector:4317/
      CHROMA_OPEN_TELEMETRY__SERVICE_NAME: chroma
    image: chromadb/chroma
    networks:
      game_net: null
    ports:
    - mode: ingress
      target: 8000
      published: "36333"
      protocol: tcp
    volumes:
    - type: volume
      source: chroma_data
      target: /data
      volume: {}
  mafia-ai-vectordb-seed:
    build:
      context: /home/kklepikov/_code_/mafia-ai
      dockerfile: infra/vectordb/Dockerfile
    depends_on:
      mafia-ai-vectordb:
        condition: service_started
    networks:
      game_net: null
    restart: "no"
  mafia-ai-zipkin:
    depends_on:
      mafia-ai-otel-collector:
        condition: service_started
    image: openzipkin/zipkin
    networks:
      game_net: null
    ports:
    - mode: ingress
      target: 9411
      published: "29411"
      protocol: tcp
networks:
  game_net:
    name: infra_game_net
    driver: bridge
volumes:
  chroma_data:
    name: infra_chroma_data
  ollama_data:
    name: infra_ollama_data
x-agent-base:
  build:
    context: ..
    dockerfile: infra/agent/Dockerfile
  depends_on:
    mafia-ai-llm:
      condition: service_healthy
    mafia-ai-rabbitmq:
      condition: service_healthy
    mafia-ai-vectordb-seed:
      condition: service_completed_successfully
  env_file:
  - .env
  healthcheck:
    interval: 10s
    retries: 5
    start_period: 15s
    test:
    - CMD
    - curl
    - -sf
    - http://localhost:8100/agent/info
    timeout: 5s
  networks:
  - game_net
x-agent-env:
  AGENT_HTTP_PORT: "8100"
  AMQP_URL: amqp://guest:guest@mafia-ai-rabbitmq:5672/
  LLM_URL: http://mafia-ai-llm:8080
  VECTORDB_HOST: mafia-ai-vectordb
