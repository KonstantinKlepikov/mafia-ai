# Game prompts used by agents
game_prompts:
  night_speak: |
    It is nighttime. Discuss with your fellow mafia members who to eliminate. Speak as your character.

  day_speak: |
    Share your thoughts on who might be the mafia. Speak as your character.

  vote_template: |
    It is time to vote. Living players: {candidates}. Choose one player to {vote_action}. Respond with ONLY the player ID from the list above, nothing else.

  host_question_template: |
    The host asks you: "{question_text}". Answer in character, concisely.
