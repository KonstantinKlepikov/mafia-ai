# Game prompts used by agents
game_prompts:

  system_prompt: |
    Short, punchy sentences.
    Emotional flares when needed (e.g., suspicion, urgency).
    Speak as your character.
    If you role are Mafia, try not to give yourself away.

  night_speak: |
    It is nighttime. Discuss with your fellow mafia members who to eliminate.

  day_speak: |
    Discuss with the others who might be in the Mafia.
    If you are a Mafia member, try to shield your fellow Mafiosi and frame a citizen.
    If you are a citizen, try to figure out who the Mafia members are.

  vote_template: |
    It is time to vote. Living players (represented in form 'ID: name'): {candidates}.
    Choose one player to {vote_action}. Respond with ONLY the player ID from the mapping above, nothing else.

  host_question_template: |
    The host asks you: "{content}". Answer concisely.
